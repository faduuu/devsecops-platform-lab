name: Repository security

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege by default. Individual jobs can request more only if required.
permissions:
  contents: read

concurrency:
  group: repository-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Validate repository foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate expected structure
        shell: pwsh
        run: ./scripts/Test-RepositoryStructure.ps1

  secret-scan:
    name: Detect committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  yaml-lint:
    name: Validate YAML configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ci/security-tools-constraints.txt

      - name: Install yamllint
        run: pip install --constraint ci/security-tools-constraints.txt yamllint

      - name: Validate YAML files
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          yamllint --format parsable . | tee reports/yamllint.txt

      - name: Preserve YAML validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: yamllint-report
          path: reports/yamllint.txt
          if-no-files-found: warn
          retention-days: 30

  terraform-validation:
    name: Validate Terraform configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -diff -recursive infra/terraform

      - name: Initialize Terraform without a backend
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          terraform -chdir=infra/terraform validate -json |
            tee reports/terraform-validate.json

      - name: Preserve Terraform validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: terraform-validation-report
          path: reports/terraform-validate.json
          if-no-files-found: warn
          retention-days: 30

  kubernetes-validation:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: "0.8.0"
      KUBECONFORM_ARCHIVE_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install verified Kubeconform binary
        shell: bash
        run: |
          archive="kubeconform-linux-amd64.tar.gz"
          url="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/${archive}"
          curl --fail --location --silent --show-error --output "${archive}" "${url}"
          echo "${KUBECONFORM_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" kubeconform
          chmod +x kubeconform

      - name: Validate Kubernetes schemas
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          mapfile -d '' manifests < <(
            find platform/kubernetes/base \
              -type f \
              -name '*.yaml' \
              ! -name 'kustomization.yaml' \
              -print0
          )
          ./kubeconform \
            -strict \
            -summary \
            -output json \
            -kubernetes-version 1.36.0 \
            "${manifests[@]}" | tee reports/kubeconform.json

      - name: Preserve Kubernetes schema report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: kubeconform-report
          path: reports/kubeconform.json
          if-no-files-found: error
          retention-days: 30

  configuration-security:
    name: Audit configuration security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ci/security-tools-constraints.txt

      - name: Install Checkov
        run: pip install --constraint ci/security-tools-constraints.txt checkov

      - name: Audit GitHub Actions configuration
        run: |
          mkdir -p reports
          checkov \
            --directory .github/workflows \
            --framework github_actions \
            --output cli \
            --output junitxml \
            --output-file-path console,reports/checkov-github-actions.xml \
            --skip-download

      - name: Audit Terraform configuration
        run: |
          checkov \
            --directory infra/terraform \
            --framework terraform \
            --output cli \
            --output junitxml \
            --output-file-path console,reports/checkov-terraform.xml \
            --skip-download

      - name: Audit Kubernetes configuration
        run: |
          checkov \
            --directory platform/kubernetes \
            --framework kubernetes \
            --output cli \
            --output junitxml \
            --output-file-path console,reports/checkov-kubernetes.xml \
            --skip-download

      - name: Preserve Checkov report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: checkov-configuration-report
          path: reports/checkov-*.xml
          if-no-files-found: error
          retention-days: 30
