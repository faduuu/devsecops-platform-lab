name: Repository security

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege by default. Individual jobs can request more only if required.
permissions:
  contents: read

concurrency:
  group: repository-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Validate repository foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate expected structure
        shell: pwsh
        run: ./scripts/Test-RepositoryStructure.ps1

  secret-scan:
    name: Detect committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  yaml-lint:
    name: Validate YAML configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ci/security-tools-constraints.txt

      - name: Install yamllint
        run: pip install --constraint ci/security-tools-constraints.txt yamllint

      - name: Validate YAML files
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          yamllint --format parsable . | tee reports/yamllint.txt

      - name: Preserve YAML validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: yamllint-report
          path: reports/yamllint.txt
          if-no-files-found: warn
          retention-days: 30

  configuration-security:
    name: Audit configuration security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ci/security-tools-constraints.txt

      - name: Install Checkov
        run: pip install --constraint ci/security-tools-constraints.txt checkov

      - name: Audit GitHub Actions configuration
        run: |
          mkdir -p reports
          checkov \
            --directory . \
            --framework github_actions \
            --output cli \
            --output junitxml \
            --output-file-path console,reports/checkov-github-actions.xml \
            --skip-download \
            --soft-fail

      - name: Preserve Checkov report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: checkov-github-actions-report
          path: reports/checkov-github-actions.xml
          if-no-files-found: error
          retention-days: 30
